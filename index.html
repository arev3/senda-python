<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Aprende Python paso a paso, en español, con ejercicios que se corrigen solos.">
<title>Senda Python</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: sticky top bar + single reading column; the map is a winding trail of lesson stones per module. */
:root{
  --bg:#EFF3EC; --surface:#FFFFFF; --sunk:#E3EADF; --ink:#14231B; --muted:#56675D; --line:#CBD6CC;
  --jade:#0E7A58; --jade-ink:#FFFFFF; --jade-soft:#D3EEE2; --gold:#E2A91B; --gold-soft:#FBEFC8; --gold-ink:#3D2C00;
  --blue:#2D5B9A; --ok:#1C7F47; --ok-soft:#DDF3E5; --bad:#B8402C; --bad-soft:#F8E1DB;
  --code-bg:#14211B; --code-ink:#E6EFE9; --c-kw:#7FD1AE; --c-str:#F0C674; --c-num:#F29B76; --c-com:#7D9488; --c-bi:#8FB8F2; --c-const:#E79AD0; --c-def:#FFFFFF;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:12px; --shadow:0 1px 2px rgba(20,35,27,.06), 0 6px 20px rgba(20,35,27,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1511; --surface:#15201A; --sunk:#1B2922; --ink:#E3ECE6; --muted:#97A99E; --line:#2A3A31;
  --jade:#38C48F; --jade-ink:#06140D; --jade-soft:#173A2C; --gold:#F2C14E; --gold-soft:#3A2F12; --gold-ink:#1E1600;
  --blue:#86AEEA; --ok:#4FD08A; --ok-soft:#143323; --bad:#F08A73; --bad-soft:#3A1D17;
  --code-bg:#0A110D; --code-ink:#E2EBE5; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1511; --surface:#15201A; --sunk:#1B2922; --ink:#E3ECE6; --muted:#97A99E; --line:#2A3A31;
  --jade:#38C48F; --jade-ink:#06140D; --jade-soft:#173A2C; --gold:#F2C14E; --gold-soft:#3A2F12; --gold-ink:#1E1600;
  --blue:#86AEEA; --ok:#4FD08A; --ok-soft:#143323; --bad:#F08A73; --bad-soft:#3A1D17;
  --code-bg:#0A110D; --code-ink:#E2EBE5; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.6;}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--surface)}
h1,h2,h3{font-family:var(--f-display); line-height:1.15; text-wrap:balance; margin:0; letter-spacing:-.01em}
h1{font-size:clamp(1.7rem, 4vw, 2.4rem); font-weight:700}
h2{font-size:1.45rem; font-weight:700}
h3{font-size:1.1rem; font-weight:650}
p{margin:0}
a{color:var(--jade)}
code{font-family:var(--f-mono); font-size:.88em; background:var(--sunk); padding:.08em .35em; border-radius:5px}
button{font:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px; border-radius:6px}
.wrap{max-width:1080px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--muted)}

/* ---------- top bar ---------- */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--surface); border-bottom:1px solid var(--line)}
.top .wrap{display:flex; align-items:center; gap:14px; padding-block:10px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); font-family:var(--f-display); font-weight:800; font-size:1.15rem; letter-spacing:-.02em}
.brand svg{flex:none}
.nav{display:flex; gap:4px; flex-wrap:wrap}
.nav a{text-decoration:none; color:var(--muted); padding:6px 10px; border-radius:8px; font-weight:600; font-size:.92rem}
.nav a:hover{background:var(--sunk); color:var(--ink)}
.nav a.on{background:var(--jade-soft); color:var(--ink)}
.player{margin-left:auto; display:flex; align-items:center; gap:12px; font-size:.85rem}
.lvl{display:flex; align-items:center; gap:8px}
.lvl-num{width:30px; height:30px; display:grid; place-items:center; background:var(--gold); color:var(--gold-ink); font-family:var(--f-display); font-weight:800; clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%)}
.xpbar{width:96px; height:8px; background:var(--sunk); border-radius:99px; overflow:hidden}
.xpbar i{display:block; height:100%; background:var(--gold); border-radius:99px; transition:width .5s}
.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; background:var(--sunk); font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}
.pystat{font-family:var(--f-mono); font-size:.72rem; color:var(--muted); white-space:nowrap}
.pystat.ok::before{content:"●"; color:var(--ok); margin-right:4px}
.pystat.wait::before{content:"●"; color:var(--gold); margin-right:4px}
@media (max-width:720px){ .top{position:static} .top .wrap{gap:8px 14px} .player{margin-left:0; width:100%; justify-content:space-between; gap:8px} .xpbar{width:56px} .pystat{font-size:.66rem} }

main{padding-block:28px 80px}

/* ---------- buttons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:9px 16px; border-radius:10px; font-weight:700; font-size:.95rem; text-decoration:none; transition:transform .08s, background .15s}
.btn:hover{background:var(--sunk)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--jade); border-color:var(--jade); color:var(--jade-ink)}
.btn.primary:hover{filter:brightness(1.07); background:var(--jade)}
.btn.gold{background:var(--gold); border-color:var(--gold); color:var(--gold-ink)}
.btn.ghost{border-color:transparent; background:transparent; color:var(--muted)}
.btn.ghost:hover{background:var(--sunk); color:var(--ink)}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btn.sm{padding:5px 11px; font-size:.85rem}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}

/* ---------- map ---------- */
.hero{display:grid; grid-template-columns:1.4fr 1fr; gap:24px; align-items:stretch; margin-bottom:36px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.hero-main{display:flex; flex-direction:column; gap:14px; justify-content:center}
.hero-main p{color:var(--muted); max-width:58ch}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:20px; box-shadow:var(--shadow)}
.statgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px}
.stat{background:var(--sunk); border-radius:10px; padding:10px 12px}
.stat b{display:block; font-family:var(--f-display); font-size:1.4rem; font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem; color:var(--muted)}
.lvlcard-head{display:flex; gap:14px; align-items:center}
.lvlcard-head .lvl-num{width:52px; height:52px; font-size:1.4rem}
.bigbar{height:12px; background:var(--sunk); border-radius:99px; overflow:hidden; margin-top:12px}
.bigbar i{display:block; height:100%; background:linear-gradient(90deg,var(--gold),#F5D36A); border-radius:99px}
.muted{color:var(--muted)}
.small{font-size:.85rem}

.module{margin-bottom:42px}
.mod-head{display:flex; gap:16px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; padding-bottom:12px; border-bottom:2px dashed var(--line); margin-bottom:18px}
.mod-head .titles{display:flex; flex-direction:column; gap:4px; min-width:0}
.mod-head p{color:var(--muted); font-size:.95rem}
.mod-badge{font-family:var(--f-mono); font-weight:700; background:var(--code-bg); color:var(--c-kw); padding:2px 8px; border-radius:6px; font-size:.8rem}
.mod-prog{display:flex; align-items:center; gap:10px; font-size:.85rem; color:var(--muted); font-variant-numeric:tabular-nums}
.mod-prog .xpbar{width:120px}
.mod-prog .xpbar i{background:var(--jade)}
.module.locked .trail{opacity:.55}
.lockmsg{font-size:.88rem; color:var(--muted); background:var(--sunk); border-radius:10px; padding:8px 12px; display:inline-block; margin-bottom:10px}

.trail{position:relative; display:flex; flex-direction:column; gap:14px; padding-left:4px}
.stone{--off:0%; display:flex; align-items:center; gap:14px; margin-left:var(--off); text-decoration:none; color:var(--ink); width:max-content; max-width:calc(100% - var(--off))}
.trail .stone:nth-child(4n+2){--off:12%}
.trail .stone:nth-child(4n+3){--off:22%}
.trail .stone:nth-child(4n+4){--off:12%}
@media (max-width:560px){ .trail .stone:nth-child(4n+2){--off:8%} .trail .stone:nth-child(4n+3){--off:14%} .trail .stone:nth-child(4n+4){--off:8%} }
.dot{flex:none; width:58px; height:58px; border-radius:50%; display:grid; place-items:center; font-family:var(--f-display); font-weight:800; font-size:1.2rem; background:var(--surface); border:3px solid var(--line); color:var(--muted); box-shadow:0 4px 0 var(--line); transition:transform .12s}
.stone:hover .dot{transform:translateY(-2px)}
.stone .lbl{display:flex; flex-direction:column; min-width:0}
.stone .lbl b{font-weight:700; line-height:1.25}
.stone .lbl span{font-size:.8rem; color:var(--muted)}
.stone.done .dot{background:var(--jade); border-color:var(--jade); color:var(--jade-ink); box-shadow:0 4px 0 color-mix(in srgb, var(--jade) 60%, #000)}
.stone.current .dot{background:var(--gold-soft); border-color:var(--gold); color:var(--ink); box-shadow:0 4px 0 var(--gold); animation:pulse 1.8s infinite}
.stone.locked{pointer-events:none}
.stone.locked .dot{background:var(--sunk); border-style:dashed; box-shadow:none}
.stone.exam .dot{border-radius:0; width:64px; height:64px; clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%); border:none; box-shadow:none; background:var(--code-bg); color:var(--gold); font-size:.78rem; font-family:var(--f-mono)}
.stone.exam.done .dot{background:var(--gold); color:var(--gold-ink)}
@keyframes pulse{0%,100%{box-shadow:0 4px 0 var(--gold), 0 0 0 0 color-mix(in srgb, var(--gold) 50%, transparent)} 50%{box-shadow:0 4px 0 var(--gold), 0 0 0 10px transparent}}
@media (prefers-reduced-motion: reduce){ .stone.current .dot{animation:none} *{transition:none!important} }

.coming{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px}
.coming .card{box-shadow:none; background:transparent; border-style:dashed}
.coming ul{margin:8px 0 0; padding-left:18px; color:var(--muted); font-size:.9rem}

/* ---------- lesson ---------- */
.crumbs{display:flex; gap:8px; align-items:center; font-size:.88rem; color:var(--muted); margin-bottom:12px; flex-wrap:wrap}
.crumbs a{color:var(--muted); text-decoration:none; font-weight:600}
.crumbs a:hover{color:var(--ink)}
.lesson-head{display:flex; flex-direction:column; gap:6px; margin-bottom:20px}
.steps{display:flex; gap:6px; margin-bottom:24px; flex-wrap:wrap}
.step{display:flex; align-items:center; gap:8px; padding:8px 14px 8px 8px; border-radius:99px; border:1px solid var(--line); background:var(--surface); color:var(--muted); font-weight:700; font-size:.9rem}
.step i{font-style:normal; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; background:var(--sunk); font-size:.8rem}
.step.on{border-color:var(--jade); color:var(--ink); box-shadow:0 0 0 2px var(--jade-soft)}
.step.ok i{background:var(--jade); color:var(--jade-ink)}
.reading{max-width:72ch; display:flex; flex-direction:column; gap:16px}
.reading ul,.reading ol{margin:0; padding-left:22px}
.reading li+li{margin-top:4px}
.tip{background:var(--gold-soft); border-left:4px solid var(--gold); padding:10px 14px; border-radius:0 10px 10px 0}
.tbl{border-collapse:collapse; width:100%; font-size:.92rem}
.tblwrap{overflow-x:auto}
.tbl th,.tbl td{text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top}
.tbl th{font-family:var(--f-mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
pre.out{font-family:var(--f-mono); font-size:.88rem; background:var(--sunk); padding:10px 14px; border-radius:10px; margin:0; white-space:pre-wrap; overflow-x:auto}
.next-row{display:flex; justify-content:space-between; gap:10px; margin-top:28px; flex-wrap:wrap}

/* ---------- editor ---------- */
.ed{position:relative; display:flex; background:var(--code-bg); border-radius:var(--r); overflow:hidden; font-family:var(--f-mono); font-size:14px; line-height:1.6; min-width:0}
.ed-gut{flex:none; padding:12px 8px 12px 12px; color:var(--c-com); text-align:right; user-select:none; white-space:pre; font-variant-numeric:tabular-nums; min-width:2.6em; border-right:1px solid rgba(255,255,255,.06); overflow:hidden}
.ed-gut .err{color:#FF8F7A; font-weight:700}
.ed-body{position:relative; flex:1; min-width:0}
.ed-hl,.ed-ta{margin:0; padding:12px 14px; font:inherit; line-height:inherit; white-space:pre; tab-size:4; letter-spacing:0; word-spacing:0}
.ed-hl{position:absolute; inset:0; overflow:hidden; color:var(--code-ink); pointer-events:none}
.ed-ta{position:relative; display:block; width:100%; resize:none; border:0; outline:0; background:transparent; color:transparent; caret-color:#FFE08A; overflow:auto; min-height:120px}
.ed-ta::selection{background:rgba(127,209,174,.3); color:transparent}
.ed:focus-within{box-shadow:0 0 0 3px var(--gold)}
.tk-kw{color:var(--c-kw); font-weight:600} .tk-str{color:var(--c-str)} .tk-num{color:var(--c-num)} .tk-com{color:var(--c-com); font-style:italic} .tk-bi{color:var(--c-bi)} .tk-const{color:var(--c-const)} .tk-def{color:var(--c-def); font-weight:700}
pre.code{font-family:var(--f-mono); font-size:14px; line-height:1.6; background:var(--code-bg); color:var(--code-ink); border-radius:10px; padding:10px 14px; margin:0; overflow-x:auto}

.demo{display:flex; flex-direction:column; gap:0; border-radius:var(--r); overflow:hidden; border:1px solid var(--line)}
.demo .ed{border-radius:0}
.demo-bar{display:flex; gap:8px; align-items:center; padding:8px 10px; background:var(--sunk); flex-wrap:wrap}
.demo-bar .eyebrow{margin-right:auto}
.demo-in{display:flex; align-items:center; gap:8px; font-size:.82rem; color:var(--muted)}
.demo-in input{font-family:var(--f-mono); font-size:.82rem; padding:4px 8px; border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink); width:min(220px, 50vw)}
.console{font-family:var(--f-mono); font-size:.86rem; background:var(--surface); color:var(--ink); padding:10px 14px; white-space:pre-wrap; word-break:break-word; min-height:2.6em; max-height:320px; overflow:auto; border-top:1px solid var(--line)}
.console .ph{color:var(--muted); font-style:italic}
.errbox{margin-top:8px; background:var(--bad-soft); border-left:4px solid var(--bad); padding:8px 12px; border-radius:0 8px 8px 0; font-family:var(--f-body); font-size:.9rem; white-space:normal}
.errbox b{color:var(--bad)}

/* practice layout */
.practice{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.3fr); gap:22px; align-items:start}
@media (max-width:900px){.practice{grid-template-columns:1fr}}
.task{display:flex; flex-direction:column; gap:14px}
.task .card{box-shadow:none}
.task ol,.task ul{margin:6px 0 0; padding-left:22px}
.workbench{display:flex; flex-direction:column; gap:10px; min-width:0}
.inputs{display:flex; flex-direction:column; gap:4px}
.inputs label{font-size:.82rem; font-weight:700; color:var(--muted)}
.inputs textarea{font-family:var(--f-mono); font-size:.86rem; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); resize:vertical; min-height:3.2em}
.outwrap{border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.outwrap .demo-bar{padding:6px 12px}
.outwrap .console{border-top:0}
.checks{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
.checks li{display:flex; gap:10px; align-items:flex-start; padding:8px 12px; border-radius:8px; background:var(--sunk); font-size:.92rem}
.checks li .ic{flex:none; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:.75rem; font-weight:800}
.checks li.pass{background:var(--ok-soft)} .checks li.pass .ic{background:var(--ok); color:var(--surface)}
.checks li.fail{background:var(--bad-soft)} .checks li.fail .ic{background:var(--bad); color:var(--surface)}
.checks li small{display:block; color:var(--muted); font-family:var(--f-mono); font-size:.75rem}
.hint{background:var(--gold-soft); border-radius:10px; padding:10px 14px; font-size:.92rem}
.hint b{font-family:var(--f-mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.1em}
.win{background:var(--ok-soft); border:2px solid var(--ok); border-radius:var(--r); padding:16px 18px; display:flex; flex-direction:column; gap:10px}
.win h3{color:var(--ok)}

/* quiz */
.quiz{max-width:640px; display:flex; flex-direction:column; gap:14px}
.opts{display:grid; gap:8px}
.opt{text-align:left; padding:12px 16px; border-radius:10px; border:2px solid var(--line); background:var(--surface); color:var(--ink); font-weight:600; display:flex; gap:12px; align-items:center}
.opt kbd{font-family:var(--f-mono); font-size:.75rem; background:var(--sunk); border-radius:5px; padding:1px 7px; color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--jade)}
.opt.right{border-color:var(--ok); background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.explain{padding:10px 14px; border-radius:10px; background:var(--sunk)}

/* exam */
.exam-prog{display:flex; gap:4px; margin-bottom:18px}
.exam-prog i{flex:1; height:6px; border-radius:99px; background:var(--sunk)}
.exam-prog i.ok{background:var(--ok)} .exam-prog i.ko{background:var(--bad)} .exam-prog i.cur{background:var(--gold)}
.score{font-family:var(--f-display); font-size:4rem; font-weight:800; line-height:1; font-variant-numeric:tabular-nums}

/* badges */
.badges{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:14px}
.bdg{display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; padding:18px 12px; border-radius:var(--r); background:var(--surface); border:1px solid var(--line)}
.hex{width:74px; height:74px; display:grid; place-items:center; clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%); background:var(--code-bg); color:var(--gold); font-family:var(--f-mono); font-weight:700; font-size:.9rem}
.bdg.off{opacity:.5} .bdg.off .hex{background:var(--sunk); color:var(--muted)}
.bdg b{font-family:var(--f-display); line-height:1.2}
.bdg span{font-size:.8rem; color:var(--muted)}

/* sources */
.srcs{display:grid; gap:10px; max-width:760px}
.srcs a{display:block; text-decoration:none; color:var(--ink); padding:14px 16px; border:1px solid var(--line); border-radius:10px; background:var(--surface)}
.srcs a:hover{border-color:var(--jade)}
.srcs a b{display:block} .srcs a span{font-size:.88rem; color:var(--muted)}

/* toast */
.toasts{position:fixed; right:max(16px, env(safe-area-inset-right,0px)); bottom:calc(16px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:8px; z-index:50; pointer-events:none}
.toast{background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:12px; font-weight:700; box-shadow:var(--shadow); display:flex; gap:10px; align-items:center; animation:tin .3s ease-out; max-width:min(340px, calc(100vw - 32px))}
.toast .hex{width:36px; height:36px; font-size:.62rem; flex:none; background:var(--gold); color:var(--gold-ink)}
.toast.xp{background:var(--gold); color:var(--gold-ink)}
@keyframes tin{from{transform:translateY(12px); opacity:0} to{transform:none; opacity:1}}
.foot{margin-top:50px; padding-top:18px; border-top:1px solid var(--line); font-size:.85rem; color:var(--muted); display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}
.linkbtn{background:none; border:0; color:var(--muted); text-decoration:underline; padding:0; font-size:inherit}

<script type="text/python">
import sys, json, re, traceback
from browser import window

# Arreglos para fallos del módulo re de Brython:
# fullmatch con grupos y \s dentro de clases negadas [^...]
def _arreglar_patron(p):
    if not isinstance(p, str) or '[^' not in p:
        return p
    r, i, dentro = [], 0, False
    while i < len(p):
        ch = p[i]
        if ch == '\\' and i + 1 < len(p):
            par = p[i:i + 2]
            r.append(' \t\n\r\f\v' if (dentro and par == '\\s') else par)
            i += 2
            continue
        if not dentro and p.startswith('[^', i):
            dentro = True
            r.append('[^')
            i += 2
            if i < len(p) and p[i] == ']':
                r.append(']')
                i += 1
            continue
        if dentro and ch == ']':
            dentro = False
        r.append(ch)
        i += 1
    return ''.join(r)

def _envolver(nombre):
    f = getattr(re, nombre)
    def g(pattern, *a, **k):
        return f(_arreglar_patron(pattern), *a, **k)
    g.__name__ = nombre
    setattr(re, nombre, g)

for _n in ['search', 'match', 'findall', 'finditer', 'sub', 'subn', 'split', 'compile']:
    _envolver(_n)

def _fullmatch(pattern, string, flags=0):
    if isinstance(pattern, str):
        return re.match('(?:' + pattern + r')\Z', string, flags)
    return re.match('(?:' + pattern.pattern + r')\Z', string, pattern.flags)
re.fullmatch = _fullmatch

# json de Brython lanza un error que no hereda de ValueError: lo convertimos
import json as _json_mod
class _JSONDecodeError(ValueError):
    pass
_JSONDecodeError.__name__ = "JSONDecodeError"
_json_loads_orig = _json_mod.loads
def _json_loads(s, *a, **k):
    try:
        return _json_loads_orig(s, *a, **k)
    except ValueError:
        raise
    except Exception as e:
        if isinstance(s, (str, bytes)):
            raise _JSONDecodeError(str(e))
        raise
def _json_load(f, *a, **k):
    return _json_loads(f.read(), *a, **k)
_json_mod.loads = _json_loads
_json_mod.load = _json_load
_json_mod.JSONDecodeError = _JSONDecodeError

class _Salida:
    def __init__(self):
        self.buf = []
        self.n = 0
    def write(self, s):
        s = str(s)
        if self.n < 20000:
            self.buf.append(s)
            self.n += len(s)
            if self.n >= 20000:
                self.buf.append("\n... (salida recortada)\n")
        return len(s)
    def flush(self):
        pass

class BucleInfinito(Exception):
    pass

# Disco virtual: open() trabaja en memoria con unos archivos de ejemplo.
import io
_DISCO_INICIAL = {
    "notas.txt": "Ana 8\nLuis 5\nMarta 9.5\nPedro 4\n",
    "poema.txt": "Caminante, son tus huellas\nel camino y nada más;\ncaminante, no hay camino,\nse hace camino al andar.\n",
    "ventas.csv": "producto,cantidad,precio\npan,3,1.2\nleche,2,0.95\nhuevos,12,0.25\npan,1,1.2\n",
    "config.json": '{"usuario": "ana", "tema": "oscuro", "volumen": 7}',
}
_DISCO = {}

class _Archivo:
    def __init__(self, nombre, modo, inicial=""):
        self._b = io.StringIO(inicial)
        self._nombre = nombre
        self._modo = modo
        self.name = nombre
        self.mode = modo
        self.closed = False
        if "a" in modo:
            self._b.seek(0, 2)
    def _ok(self):
        if self.closed:
            raise ValueError("I/O operation on closed file.")
    def read(self, n=-1):
        self._ok()
        return self._b.read() if n is None or n < 0 else self._b.read(n)
    def readline(self, *a):
        self._ok()
        return self._b.readline(*a)
    def readlines(self):
        self._ok()
        return self._b.readlines()
    def write(self, t):
        self._ok()
        if not isinstance(t, str):
            raise TypeError("write() argument must be str, not " + type(t).__name__)
        if "r" in self._modo and "+" not in self._modo:
            raise io.UnsupportedOperation("not writable")
        return self._b.write(t)
    def writelines(self, ls):
        for l in ls:
            self.write(l)
    def seek(self, *a):
        return self._b.seek(*a)
    def tell(self):
        return self._b.tell()
    def __iter__(self):
        return self
    def __next__(self):
        self._ok()
        l = self._b.readline()
        if not l:
            raise StopIteration
        return l
    def close(self):
        if not self.closed and ("w" in self._modo or "a" in self._modo or "+" in self._modo):
            _DISCO[self._nombre] = self._b.getvalue()
        self.closed = True
    def __enter__(self):
        return self
    def __exit__(self, *a):
        self.close()
        return False

def _open(nombre, modo="r", *a, **k):
    nombre = str(nombre)
    if "r" in modo and "+" not in modo or modo in ("r+",):
        if nombre not in _DISCO:
            raise FileNotFoundError("[Errno 2] No such file or directory: '" + nombre + "'")
        return _Archivo(nombre, modo, _DISCO[nombre])
    if "x" in modo and nombre in _DISCO:
        raise FileExistsError("[Errno 17] File exists: '" + nombre + "'")
    if "a" in modo:
        return _Archivo(nombre, modo, _DISCO.get(nombre, ""))
    _DISCO[nombre] = ""
    return _Archivo(nombre, modo, "")

def run(src, original, inputs, checks_json):
    checks = json.loads(checks_json) if checks_json else []
    out = _Salida()
    old = (sys.stdout, sys.stderr)
    sys.stdout = out
    sys.stderr = out
    cola = [str(x) for x in inputs]
    cuenta = [0]
    def _input(prompt=""):
        out.write(str(prompt))
        if not cola:
            raise EOFError("input() no tiene más datos que leer")
        v = cola.pop(0)
        out.write(v + "\n")
        return v
    def _tick():
        cuenta[0] += 1
        if cuenta[0] > 200000:
            raise BucleInfinito("demasiadas vueltas: posible bucle infinito")
        return True
    def _loop(it):
        for x in it:
            _tick()
            yield x
    _DISCO.clear()
    _DISCO.update(_DISCO_INICIAL)
    ns = {"__name__": "__main__", "input": _input, "__tick__": _tick, "__loop__": _loop, "open": _open}
    res = {"ok": True}
    try:
        exec(compile(src, "tu_codigo.py", "exec"), ns)
    except SystemExit:
        pass
    except BaseException as e:
        try:
            tbs = traceback.format_exc()
        except Exception:
            tbs = ""
        lineas = [int(x) for x in re.findall(r'tu_codigo.py", line (\d+)', tbs)]
        ln = getattr(e, "lineno", None) if isinstance(e, SyntaxError) else None
        res = {"ok": False, "type": type(e).__name__, "msg": str(e), "line": ln or (lineas[-1] if lineas else None)}
    finally:
        sys.stdout, sys.stderr = old
    salida = "".join(out.buf)
    res["out"] = salida
    if checks:
        ns["_salida"] = salida
        ns["_lineas"] = [l.strip() for l in salida.splitlines() if l.strip()]
        ns["_codigo"] = original
        ns["_disco"] = _DISCO
        def _lanza(f, *a, **k):
            try:
                f(*a, **k)
                return None
            except BaseException as e:
                return type(e).__name__
        ns["_lanza"] = _lanza
        resultados = []
        for expr in checks:
            try:
                resultados.append({"ok": bool(eval(expr, ns))})
            except BaseException as e:
                resultados.append({"ok": False, "err": type(e).__name__ + ": " + str(e)})
        res["checks"] = resultados
    return json.dumps(res)

window.pyRun = run
window.__pyReady()

from dataclasses import dataclass, asdict

@dataclass
class Libro:
    isbn: str
    titulo: str
    autor: str
    prestado: bool = False

class ErrorBiblioteca(Exception):
    pass

class Biblioteca:
    def __init__(self):
        self.libros = {}

    def agregar(self, libro):
        if libro.isbn in self.libros:
            raise ErrorBiblioteca(f"El ISBN {libro.isbn} ya existe")
        self.libros[libro.isbn] = libro

    def _obtener(self, isbn):
        if isbn not in self.libros:
            raise ErrorBiblioteca(f"No existe el ISBN {isbn}")
        return self.libros[isbn]

    def prestar(self, isbn):
        libro = self._obtener(isbn)
        if libro.prestado:
            raise ErrorBiblioteca("Ya está prestado")
        libro.prestado = True

    def devolver(self, isbn):
        libro = self._obtener(isbn)
        if not libro.prestado:
            raise ErrorBiblioteca("No estaba prestado")
        libro.prestado = False

    def buscar(self, texto):
        t = texto.lower()
        return sorted(l.titulo for l in self.libros.values()
                      if t in l.titulo.lower() or t in l.autor.lower())

    def guardar(self, nombre):
        with open(nombre, "w") as f:
            json.dump([asdict(l) for l in self.libros.values()], f)

    @classmethod
    def cargar(cls, nombre):
        b = cls()
        with open(nombre) as f:
            for d in json.load(f):

  const ta = $('textarea', host), pre = $('pre', host), gut = $('.ed-gut', host);
  let errLine = 0;
  const paint = () => {
    const v = ta.value; pre.innerHTML = hl(v) + '\n';
    const n = v.split('\n').length; let g = '';
    for (let i = 1; i <= n; i++) g += (i === errLine ? `<span class="err">${i}</span>` : i) + '\n';
    gut.innerHTML = g;
    ta.style.height = 'auto'; ta.style.height = Math.max(opts.min || 120, ta.scrollHeight) + 'px';
  };
  ta.addEventListener('scroll', () => { pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft; gut.scrollTop = ta.scrollTop; });
  ta.addEventListener('input', () => { errLine = 0; paint(); opts.onChange && opts.onChange(ta.value); });
  ta.addEventListener('keydown', e => {
    const s = ta.selectionStart, en = ta.selectionEnd, v = ta.value;
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); opts.onRun && opts.onRun(); return; }
    if (e.key === 'Tab' && !e.altKey){
      e.preventDefault();
      const ls = v.lastIndexOf('\n', s - 1) + 1;
      if (e.shiftKey){
        const lines = v.slice(ls, en).split('\n'); let removed0 = 0, removed = 0;
        const nl = lines.map((l, i) => { const k = l.match(/^ {1,4}/); const r = k ? k[0].length : 0; if (i === 0) removed0 = r; removed += r; return l.slice(r); }).join('\n');
        ta.setRangeText(nl, ls, en, 'preserve'); ta.selectionStart = Math.max(ls, s - removed0); ta.selectionEnd = en - removed;
      } else if (s !== en && v.slice(s, en).includes('\n')){
        const lines = v.slice(ls, en).split('\n');
        ta.setRangeText(lines.map(l => '    ' + l).join('\n'), ls, en, 'preserve'); ta.selectionStart = s + 4; ta.selectionEnd = en + 4 * lines.length;
      } else { ta.setRangeText('    ', s, en, 'end'); }
      ta.dispatchEvent(new Event('input')); return;
    }
    if (e.key === 'Enter' && !e.shiftKey){
      const ls = v.lastIndexOf('\n', s - 1) + 1; const line = v.slice(ls, s);
      let ind = (line.match(/^\s*/) || [''])[0];
      if (/:\s*(#.*)?$/.test(line)) ind += '    ';
      else if (/^\s*(return|break|continue|pass)\b/.test(line)) ind = ind.slice(0, Math.max(0, ind.length - 4));
      e.preventDefault(); ta.setRangeText('\n' + ind, s, en, 'end'); ta.dispatchEvent(new Event('input')); return;
    }
    if (e.key === 'Backspace' && s === en && s > 0){
      const ls = v.lastIndexOf('\n', s - 1) + 1; const before = v.slice(ls, s);
      if (before.length && /^ +$/.test(before)){ e.preventDefault(); const k = ((before.length - 1) % 4) + 1; ta.setRangeText('', s - k, s, 'end'); ta.dispatchEvent(new Event('input')); }
    }
  });
  ta.style.minHeight = (opts.min || 120) + 'px'; ta.value = code || ''; paint();
  return {ta, get: () => ta.value, set: v => { ta.value = v; errLine = 0; paint(); opts.onChange && opts.onChange(v); }, mark: n => { errLine = n || 0; paint(); }};
}

function renderLesson(id){
  const l = lessonById(id); if (!l) return go('mapa');

  const mi = MODULES.indexOf(l.mod), li = l.mod.lessons.findIndex(x => x.id === id);
  const tabs = [['Teoría', st.th], ['Comprueba', st.q], ['Practica', st.ex]].map((t, i) =>
    `<button class="step ${step === i + 1 ? 'on' : ''} ${t[1] ? 'ok' : ''}" data-step="${i + 1}"><i>${t[1] ? '✓' : i + 1}</i>${t[0]}</button>`).join('');

// ---------- traducción de errores ----------
function traducir(e){
  const m = (e && (e.message || e.error_description || e.msg)) || String(e || '');
  const t = [
    [/Invalid login credentials/i, 'Correo o contraseña incorrectos.'],
    [/Email not confirmed/i, 'Todavía no confirmaste tu correo. Busca el mensaje que te enviamos (revisa también Spam).'],
    [/User already registered|already been registered/i, 'Ese correo ya tiene una cuenta. Inicia sesión o recupera tu contraseña.'],
    [/Password should be at least (\d+)/i, 'La contraseña debe tener al menos $1 caracteres.'],
    [/Unable to validate email|invalid format|is invalid/i, 'Ese correo no parece válido.'],
    [/rate limit|too many|security purposes/i, 'Demasiados intentos seguidos. Espera un minuto y vuelve a probar.'],
    [/provider is not enabled|Unsupported provider/i, 'Ese método de acceso todavía no está activado en el servidor.'],
    [/Failed to fetch|NetworkError|Load failed/i, 'No se pudo conectar con ' + (window.__sendaHost || 'Supabase') + '. Revisa que SUPABASE_URL en config.js esté bien escrita y que el proyecto de Supabase no esté pausado.'],
    [/Invalid path specified/i, 'La dirección de Supabase en config.js no es correcta. Debe ser solo https://xxxx.supabase.co, sin /rest/v1/ al final.'],
    [/Invalid API key|No API key/i, 'La clave de Supabase en config.js no es correcta. Copia de nuevo la clave anon o publishable.'],
    [/New password should be different/i, 'La nueva contraseña debe ser distinta de la anterior.']
  ];
  for (const [re, es] of t){ const mm = m.match(re); if (mm) return es.replace('$1', mm[1] || ''); }
  return 'Algo salió mal: ' + m;
}

// ---------- sincronización ----------
async function cargarNube(){
  if (!sb || !usuario) return;
  sincronizando = true; estadoNube = 'Sincronizando…'; pintar();
  try {
    const {data, error} = await sb.from('progreso').select('estado').eq('user_id', usuario.id).maybeSingle();
    if (error) throw error;
    const local = window.SendaApp.getState();
    if (data && data.estado){
      const remoto = data.estado;
      if (window.SendaApp.isBlank() || (remoto.xp || 0) >= (local.xp || 0)){
        ultimoSubido = JSON.stringify(remoto);
        window.SendaApp.setState(remoto);
      } else {
        await subir(local);
      }
    } else {
      await subir(local);
    }
    estadoNube = 'Avance guardado en tu cuenta';
    window.SendaApp.refresh();
  } catch (e){
    estadoNube = 'No se pudo sincronizar: ' + traducir(e);
  }
  sincronizando = false; pintar();
}
async function subir(st){
  if (!sb || !usuario) return;
  const txt = JSON.stringify(st);
  if (txt === ultimoSubido) return;
  const {error} = await sb.from('progreso').upsert({user_id: usuario.id, estado: st, actualizado: new Date().toISOString()});
  if (error){ estadoNube = 'No se pudo guardar: ' + traducir(error); pintar(); return; }
  ultimoSubido = txt; estadoNube = 'Avance guardado en tu cuenta'; pintar();
}
window.SendaApp.onSave = st => {

  clearTimeout(subirT); subirT = setTimeout(() => subir(st), 1200);

  const n = nombreDe(usuario);
  host.innerHTML = `<span class="acc-wrap"><button class="acc-av" data-acc="menu" aria-haspopup="true" aria-label="Mi cuenta: ${esc(n)}">${esc(n.trim()[0] || '?').toUpperCase()}</button>
    <span class="acc-menu" id="acc-menu" hidden><b>${esc(n)}</b><span class="small muted">${esc(usuario.email || '')}</span><span class="small acc-sync">${esc(estadoNube)}</span><button class="linkbtn" data-acc="salir">Cerrar sesión</button></span></span>`;
}
window.SendaCuenta = {pintar};

// ---------- interfaz: ventana de acceso ----------
let modo = 'entrar';
function ventana(contenido){
  cerrar();
  const d = document.createElement('div');
  d.className = 'acc-velo'; d.id = 'acc-velo';
  d.innerHTML = `<div class="acc-modal card" role="dialog" aria-modal="true" aria-labelledby="acc-tit"><button class="acc-x" data-acc="cerrar" aria-label="Cerrar">×</button>${contenido}</div>`;
  document.body.appendChild(d);
  const f = d.querySelector('input'); if (f) f.focus();
}
function cerrar(){ const v = document.getElementById('acc-velo'); if (v) v.remove(); }
function obligatorio(){ return !!CFG.LOGIN_OBLIGATORIO && !usuario; }

function abrirAcceso(m){
  modo = m || modo;
  const provs = (CFG.PROVEEDORES || []).filter(p => NOMBRES[p]);
  const sociales = provs.length ? `<div class="acc-social">${provs.map(p => `<button class="btn acc-prov" data-acc="oauth" data-p="${p}">${ICONOS[p] || ''}<span>Continuar con ${NOMBRES[p]}</span></button>`).join('')}</div><div class="acc-or"><span>o con tu correo</span></div>` : '';
  const registro = modo === 'registro';
  ventana(`<h2 id="acc-tit">${registro ? 'Crea tu cuenta' : 'Inicia sesión'}</h2>
    <p class="small muted">${registro ? 'Guarda tu avance y sigue desde cualquier dispositivo.' : 'Entra para recuperar tu avance.'}</p>
    <div class="acc-tabs" role="tablist"><button role="tab" aria-selected="${!registro}" class="${registro ? '' : 'on'}" data-acc="modo" data-m="entrar">Iniciar sesión</button><button role="tab" aria-selected="${registro}" class="${registro ? 'on' : ''}" data-acc="modo" data-m="registro">Crear cuenta</button></div>
    ${sociales}
    <form class="acc-form" id="acc-form" novalidate>
      ${registro ? `<label>Nombre<input name="nombre" autocomplete="name" required maxlength="60"></label>` : ''}
      <label>Correo electrónico<input name="correo" type="email" autocomplete="email" required></label>
      <label>Contraseña<input name="clave" type="password" autocomplete="${registro ? 'new-password' : 'current-password'}" required minlength="6"></label>
      ${registro ? '<span class="small muted">Mínimo 6 caracteres. Te enviaremos un correo para confirmar tu cuenta.</span>' : ''}
      <p class="acc-msg" id="acc-msg" role="status"></p>
      <button class="btn primary" type="submit">${registro ? 'Crear cuenta' : 'Entrar'}</button>
      ${registro ? '' : '<button class="linkbtn" type="button" data-acc="olvido">¿Olvidaste tu contraseña?</button>'}
    </form>`);
}
function mensaje(txt, ok){ const m = document.getElementById('acc-msg'); if (m){ m.textContent = txt; m.className = 'acc-msg ' + (ok ? 'ok' : 'err'); } }
function ocupado(b){ const btn = document.querySelector('#acc-form [type=submit]'); if (btn){ btn.disabled = b; btn.classList.toggle('busy', b); } }
const volverA = () => location.origin + location.pathname;

async function enviar(form){
  const datos = Object.fromEntries(new FormData(form));
  const correo = (datos.correo || '').trim(), clave = datos.clave || '';
  if (!/^\S+@\S+\.\S+$/.test(correo)) return mensaje('Escribe un correo válido.');
  if (clave.length < 6) return mensaje('La contraseña debe tener al menos 6 caracteres.');
  ocupado(true); mensaje('');
  try {
    if (modo === 'registro'){
      const nombre = (datos.nombre || '').trim();
      if (!nombre){ ocupado(false); return mensaje('Escribe tu nombre.'); }
      const {data, error} = await sb.auth.signUp({email: correo, password: clave, options: {data: {full_name: nombre}, emailRedirectTo: volverA()}});
      if (error) throw error;
      if (data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) throw new Error('User already registered');
      if (data && data.session) { cerrar(); return; }
      ventana(`<h2 id="acc-tit">Revisa tu correo</h2><p>Te enviamos un enlace a <b>${esc(correo)}</b>. Ábrelo para confirmar tu cuenta y volverás aquí con la sesión iniciada.</p><p class="small muted">Si no lo ves en unos minutos, mira en Spam o Promociones.</p><button class="btn primary" data-acc="cerrar">Entendido</button>`);
    } else {
      const {error} = await sb.auth.signInWithPassword({email: correo, password: clave});
      if (error) throw error;
      cerrar();
    }
  } catch (e){ mensaje(traducir(e)); }
  ocupado(false);
}
async function olvido(){
  const inp = document.querySelector('#acc-form [name=correo]');
  const correo = inp ? inp.value.trim() : '';
  if (!/^\S+@\S+\.\S+$/.test(correo)) return mensaje('Escribe arriba tu correo y vuelve a pulsar «¿Olvidaste tu contraseña?».');
  const {error} = await sb.auth.resetPasswordForEmail(correo, {redirectTo: volverA()});
  if (error) return mensaje(traducir(error));
  mensaje('Te enviamos un correo con un enlace para crear una contraseña nueva.', true);
}
function pedirNuevaClave(){
  ventana(`<h2 id="acc-tit">Nueva contraseña</h2><form class="acc-form" id="acc-nueva" novalidate><label>Contraseña nueva<input name="clave" type="password" autocomplete="new-password" minlength="6" required></label><p class="acc-msg" id="acc-msg" role="status"></p><button class="btn primary" type="submit">Guardar contraseña</button></form>`);
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-acc]');
  if (!b){
    const menu = document.getElementById('acc-menu'); if (menu && !menu.hidden && !e.target.closest('.acc-wrap')) menu.hidden = true;
    if (e.target.id === 'acc-velo' && !obligatorio()) cerrar();
    return;
  }
  const a = b.dataset.acc;
  if (a === 'abrir') abrirAcceso('entrar');
  else if (a === 'cerrar'){ if (!obligatorio()) cerrar(); else abrirAcceso('entrar'); }
  else if (a === 'modo') abrirAcceso(b.dataset.m);
  else if (a === 'olvido') olvido();
  else if (a === 'menu'){ const m = document.getElementById('acc-menu'); if (m) m.hidden = !m.hidden; }
  else if (a === 'salir'){
    if (subirT){ clearTimeout(subirT); await subir(window.SendaApp.getState()); }
    await sb.auth.signOut();
  }
  else if (a === 'oauth'){
    const {error} = await sb.auth.signInWithOAuth({provider: b.dataset.p, options: {redirectTo: volverA()}});
    if (error) mensaje(traducir(error));
  }
});
document.addEventListener('submit', async e => {
  if (e.target.id === 'acc-form'){ e.preventDefault(); enviar(e.target); }
  else if (e.target.id === 'acc-nueva'){
    e.preventDefault();
    const clave = new FormData(e.target).get('clave') || '';
    if (clave.length < 6) return mensaje('La contraseña debe tener al menos 6 caracteres.');
    const {error} = await sb.auth.updateUser({password: clave});
    if (error) return mensaje(traducir(error));
    ventana(`<h2 id="acc-tit">Listo</h2><p>Tu contraseña se cambió y ya tienes la sesión iniciada.</p><button class="btn primary" data-acc="cerrar">Seguir aprendiendo</button>`);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('acc-velo') && !obligatorio()) cerrar(); });

// ---------- sesión ----------
if (sb){
  window.SendaApp.footerText = 'Inicia sesión para guardar tu avance en tu cuenta.';
  sb.auth.onAuthStateChange((evento, sesion) => {
    const antes = usuario && usuario.id;
    usuario = sesion ? sesion.user : null;
    if (evento === 'PASSWORD_RECOVERY'){ pedirNuevaClave(); }
    if (usuario && usuario.id !== antes){
      window.SendaApp.footerText = 'Tu avance se guarda en tu cuenta.';
      if (!document.getElementById('acc-nueva')) cerrar();
      setTimeout(cargarNube, 0);
    }
    if (!usuario && antes){
      // al cerrar sesión se limpia el avance de este navegador
      ultimoSubido = ''; estadoNube = '';
      window.SendaApp.footerText = 'Inicia sesión para guardar tu avance en tu cuenta.';
      window.SendaApp.setState(null);
      if (CFG.LOGIN_OBLIGATORIO) abrirAcceso('entrar');
    }
    pintar();
    if (!usuario && CFG.LOGIN_OBLIGATORIO && !document.getElementById('acc-velo')) abrirAcceso('entrar');
  });
}
})();

</script>
<script>
function patchFloat(){
  // Brython 3.12 lanza TypeError en float("hola"); Python real lanza ValueError
  try {
    const B = window.__BRYTHON__, F = B.builtins.float, orig = F.$factory;
    F.$factory = function(v){
      try { return orig.apply(this, arguments); }
      catch (e) {
        if (e && e.__class__ === B.builtins.TypeError && (typeof v === 'string' || (v && v.__class__ === B.builtins.str)))
          throw B.builtins.ValueError.$factory('could not convert string to float: ' + B.builtins.repr(v));
        throw e;
      }
    };
  } catch (e) {}
}
(function boot(){ if (window.brython) { patchFloat(); try { brython({debug: 0}); } catch (e) { console.error(e); } } else setTimeout(boot, 200); })();
</script>
